name: Scheduled scrape

on:
  schedule:
    # 06:00 UTC daily. forex.pk updates its table roughly once a day, so
    # there's no benefit to polling more often.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: pip install -e .

      - name: Scrape latest rates into SQLite history
        run: forex-tracker scrape

      - name: Render one trend chart per tracked currency
        run: forex-tracker chart --output-dir docs/screenshots

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/forex_tracker.db docs/screenshots/*_trend.png
          git diff --cached --quiet || git commit -m "chore: scheduled rate scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
